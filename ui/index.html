<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>某果短剧自用端</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="titlebar">
    <div class="brand">
      <img class="brand-logo" src="../assets/icon.png" alt="">
      <span class="brand-name">某果短剧自用端</span>
      <span class="brand-tag">自用版</span>
    </div>

    <div class="nav no-drag">
      <button class="icon-btn" id="btn-back" title="后退 (Alt + ←)" disabled>
        <svg viewBox="0 0 20 20"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
      </button>
      <button class="icon-btn" id="btn-forward" title="前进 (Alt + →)" disabled>
        <svg viewBox="0 0 20 20"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>
      </button>
      <button class="icon-btn" id="btn-reload" title="刷新 (Ctrl + R)">
        <svg viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.76-4.24M16 4v3.8h-3.8"/></svg>
      </button>
      <button class="icon-btn" id="btn-home" title="回到首页">
        <svg viewBox="0 0 20 20"><path d="M3.5 9.2 10 3.8l6.5 5.4v6.2a1 1 0 0 1-1 1h-3.6v-4.2H8.1v4.2H4.5a1 1 0 0 1-1-1Z"/></svg>
      </button>
    </div>

    <div class="drag-region"></div>

    <div class="right no-drag">
      <span class="status-dot" id="status-dot" title="已连接"></span>
      <button class="icon-btn subtle" id="btn-browser" title="在浏览器中打开">
        <svg viewBox="0 0 20 20"><path d="M11.5 3.5h5v5M16.2 3.8l-6.4 6.4M8.5 4.5H5a1.5 1.5 0 0 0-1.5 1.5v9A1.5 1.5 0 0 0 5 16.5h9a1.5 1.5 0 0 0 1.5-1.5v-3.5"/></svg>
      </button>
      <div class="sep"></div>
      <button class="win-btn" id="btn-min" title="最小化">
        <svg viewBox="0 0 20 20"><path d="M5 10h10"/></svg>
      </button>
      <button class="win-btn" id="btn-max" title="最大化">
        <svg viewBox="0 0 20 20" class="ico-max"><rect x="5.5" y="5.5" width="9" height="9" rx="1.2"/></svg>
        <svg viewBox="0 0 20 20" class="ico-restore"><path d="M7.5 7.5v-1a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1"/><rect x="4.5" y="7.5" width="8" height="8" rx="1"/></svg>
      </button>
      <button class="win-btn close" id="btn-close" title="关闭">
        <svg viewBox="0 0 20 20"><path d="m5.5 5.5 9 9m0-9-9 9"/></svg>
      </button>
    </div>
  </header>

  <div id="progress" aria-hidden="true"><i></i></div>

  <main id="stage">
    <webview id="view"
             src="https://hongguoduanju.com/category/real-drama"
             partition="persist:main"
             allowpopups
             webpreferences="contextIsolation=yes,nodeIntegration=no,autoplayPolicy=no-user-gesture-required"></webview>

    <div id="splash" class="overlay">
      <div class="splash-aura"></div>
      <div class="splash-logo">
        <span class="ring"></span>
        <span class="ring ring-2"></span>
        <img src="../assets/icon.png" alt="">
      </div>
      <h1>某果短剧自用端</h1>
      <p id="splash-tip">正在为你准备今日好剧</p>
      <div class="splash-track"><i></i></div>
    </div>

    <div id="error" class="overlay hidden">
      <div class="error-card">
        <div class="error-mark">
          <svg viewBox="0 0 24 24"><path d="M12 7.5v5.2M12 16.2v.3"/><circle cx="12" cy="12" r="8.5"/></svg>
        </div>
        <h2>页面暂时没有响应</h2>
        <p>网络开了个小差，检查连接后再试一次</p>
        <div class="error-actions">
          <button id="btn-retry" class="btn primary">重新加载</button>
          <button id="btn-error-browser" class="btn ghost">用浏览器打开</button>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
